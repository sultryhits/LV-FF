name: Refresh fantasy data and deploy site

on:
  schedule:
    # All times UTC. Tue 9am ET, Thu 5pm ET, Sun 9am ET (EDT, UTC-4).
    # If you ever want to nudge these, https://crontab.guru helps.
    - cron: "0 13 * * 2"   # Tuesday  9:00 AM ET -- post-MNF, ROS/consensus refresh
    - cron: "0 21 * * 4"   # Thursday 5:00 PM ET -- that week's props are mostly posted by now
    - cron: "0 13 * * 0"   # Sunday   9:00 AM ET -- closing-line pass, final start/sit check
  workflow_dispatch: {}     # lets you click "Run workflow" in the Actions tab any time

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch FantasyPros data
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/fetch_fantasypros.py

      - name: Fetch odds data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Track closing line value
        run: python scripts/track_clv.py

      - name: Commit CLV history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clv_history.json
          git diff --staged --quiet || git commit -m "Update CLV history [skip ci]"
          git push

      - name: Build site
        run: python scripts/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
